<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="canonical" href="https://mapoo.ir">
    <link rel="manifest" href="site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="مپو">
    <meta name="description" content="مپو ابزاری ساده و سریع برای استخراج مختصات از لینک مکان و تبدیل آن به لینک قابل استفاده در سرویس‌های مختلف نقشه است.">
    <meta name="author" content="Sepand Haghighi">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="مپو | تبدیل لینک نقشه بین سرویس‌های مختلف">
    <meta property="og:description" content="مپو ابزاری ساده و سریع برای استخراج مختصات از لینک مکان و تبدیل آن به لینک قابل استفاده در سرویس‌های مختلف نقشه است.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mapoo.ir">
    <meta property="og:image" content="https://mapoo.ir/assets/og-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="مپو | تبدیل لینک نقشه بین سرویس‌های مختلف">
    <meta name="twitter:description" content="مپو ابزاری ساده و سریع برای استخراج مختصات از لینک مکان و تبدیل آن به لینک قابل استفاده در سرویس‌های مختلف نقشه است.">
    <meta name="twitter:image" content="https://mapoo.ir/assets/og-preview.png">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="style.css" rel="stylesheet" type="text/css">
    <title>مپو | تبدیل لینک نقشه بین سرویس‌های مختلف</title>
  </head>

  <body>
    <div class="app">
      <header>
        <div class="container header-inner">
          <div class="brand">
            <img src="assets/logo.png" class="brand-icon" alt="Mapoo Logo">
            <div>
              <h1>مپو</h1>
              <p>تبدیل لینک مکان بین سرویس‌های نقشه</p>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div class="container">

          <section class="card">
            <label class="input-label" for="url-input">لینک را وارد کنید</label>
            <div class="input-row">
              <input id="url-input" type="text" inputmode="url" autocomplete="off" placeholder="مثلاً لینک Google Maps یا Neshan" dir="rtl"/>
              <input id="name-input" type="text" autocomplete="off" placeholder="نام مکان (اختیاری)" dir="rtl" maxlength="100"/>
              <button id="convert-btn" class="primary-btn" type="button">تبدیل لینک</button>
            </div>

            <div id="message" class="message"></div>

            <div id="apps" class="apps">
              <div class="app-card">
                <span class="app-name">Google Maps</span>
                <a id="google-link" class="app-link" href="#" target="_blank" rel="noopener">باز کردن</a>
              </div>

              <div class="app-card">
                <span class="app-name">Waze</span>
                <a id="waze-link" class="app-link" href="#" target="_blank" rel="noopener">باز کردن</a>
              </div>

              <div class="app-card">
                <span class="app-name">Neshan</span>
                <a id="neshan-link" class="app-link" href="#" target="_blank" rel="noopener">باز کردن</a>
              </div>

              <div class="app-card">
                <span class="app-name">Balad</span>
                <a id="balad-link" class="app-link" href="#" target="_blank" rel="noopener">باز کردن</a>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="section-header">
              <h2 class="section-title">مکان‌های ذخیره‌شده</h2>
              <button id="clear-history-btn" class="clear-btn" type="button" disabled>پاک کردن همه</button>
            </div>
            <div id="history-list" class="history-list"></div>
          </section>
        </div>
      </main>

      <footer>
        <span class="footer-name">مپو</span>
        <span id="app-version"></span>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
